[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polypmeasure"
version = "0.1.0"
description = "Polyp measurement project forged with BlueprintDL."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "blueprintdl>=0.1,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polypmeasure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
