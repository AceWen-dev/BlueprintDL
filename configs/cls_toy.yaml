# 分类网络 + 合成数据 训练配置
# 生成数据: uv run python tools/make_toy_cls_data.py --root data/cls_toy --samples-per-class 30
# 训练:     uv run python tools/train.py --config configs/cls_toy.yaml
task: classification
seed: 42
device: auto
output_dir: runs/cls_toy

data:
  train:
    type: ClassificationDataset
    params:
      image_dir: data/cls_toy/train
      transform:
        type: Compose
        params:
          transforms:
            - type: Resize
              params: { size: [64, 64] }
            - type: RandomHorizontalFlip
              params: { p: 0.5 }
            - type: ToTensor
            - type: Normalize
              params: { mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225] }
  val:
    type: ClassificationDataset
    params:
      image_dir: data/cls_toy/val
      transform:
        type: Compose
        params:
          transforms:
            - type: Resize
              params: { size: [64, 64] }
            - type: ToTensor
            - type: Normalize
              params: { mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225] }
  loader:
    batch_size: 16
    num_workers: 0
    pin_memory: false

model:
  type: Classifier
  params:
    in_channels: 3
    num_classes: 4
    backbone:
      type: SimpleCNN
      params:
        channels: [16, 32, 64, 128]
        num_blocks: [2, 2, 2, 2]

loss:
  type: CrossEntropyLoss
  params: { target_key: label }

optimizer:
  type: AdamW
  params: { lr: 0.001, weight_decay: 0.0001 }

scheduler:
  type: CosineAnnealingLR
  params: { T_max: 20 }

train:
  epochs: 20
  amp: false
  gradient_clip: 1.0
  log_interval: 10
  save_best: { name: Acc@1, mode: max }

metrics:
  - type: Accuracy
    params: { topk: [1, 2] }
