# ColonCrafter 结肠镜视频深度估计 配置（框架封装，仅推理，研究用途）
#
# 前置条件：
#   1. clone 官方仓库并初始化 submodule:
#        git clone https://github.com/rajpurkarlab/ColonCrafter third_party/ColonCrafter
#        cd third_party/ColonCrafter && git submodule update --init --recursive
#   2. 按官方 README 为目标 GPU 环境选择依赖；不要写入 BlueprintDL Core 通用锁文件
#   3. 权重：默认从 HF 下载 'romainhardy/coloncrafter'（含 tencent/DepthCrafter 基础权重，
#      需登录 HF 并同意 DepthCrafter 非商用许可）
#
# 用法:
#   uv run python tools/predict_coloncrafter.py --config configs/coloncrafter.yaml \
#       --input data/c3vd/cecum_t1_a/color \
#       --gt-dir data/c3vd/cecum_t1_a/depth \
#       --output-dir runs/predict_coloncrafter
#
# 注意: 输出为相对深度；--gt-dir 提供真值时自动逐帧 median scaling 对齐到米并评估。
task: depth_estimation
device: cuda

model:
  type: ColonCrafter
  params:
    model_path: romainhardy/coloncrafter     # HF repo id 或本地权重目录
    coloncrafter_dir: third_party/ColonCrafter   # 官方仓库路径
    device: cuda

infer:
  size: 512                      # 输入帧尺寸（建议 16 的倍数，官方视频扩散常用 512）
  num_inference_steps: 1         # 去噪步数（1 步即可，步数越多越慢）
  window_size: 16                # 滑动窗口帧数
  overlap: 8                     # 窗口重叠帧数
  guidance_scale: 1.0            # CFG 强度
  seed: 42
