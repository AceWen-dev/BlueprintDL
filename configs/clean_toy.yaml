# 数据清洗配置
# 用法: uv run python tools/clean_data.py --config configs/clean_toy.yaml
clean:
  image_dir: data/toy/train/images
  mask_dir: data/toy/train/masks
  output_dir: runs/clean_report
  action: report            # report / move / delete
  cleaners:
    - type: CorruptImage
    - type: SizeMismatch
    - type: MaskValues
      params: { num_classes: 4, ignore_values: [255] }
    - type: MinSize
      params: { min_size: 64 }
    - type: Duplicate
