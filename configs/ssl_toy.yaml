# SimCLR 风格自监督预训练 + 合成数据(不需要标签)
# 生成数据: uv run python tools/data/make_toy_data.py --root data/toy
# 预训练:   uv run python tools/train.py --config configs/ssl_toy.yaml
# 微调:     在目标任务配置里写
#           train.init_from: runs/examples/ssl_toy/<时间戳>/best.pth
task: self_supervised
seed: 42
device: auto
project: examples
name: ssl_toy

data:
  train:
    type: TwoViewDataset
    params:
      image_dir: data/toy/train/images
      view_transform:
        type: Compose
        params:
          transforms:
            - type: RandomCrop
              params: { size: [128, 128] }
            - type: RandomHorizontalFlip
              params: { p: 0.5 }
            - type: RandomBrightnessContrast
              params: { alpha: [0.7, 1.3], beta: [-0.12, 0.12] }
            - type: ToTensor
            - type: Normalize
              params: { mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225] }
  val:
    type: TwoViewDataset
    params:
      image_dir: data/toy/val/images
      view_transform:
        type: Compose
        params:
          transforms:
            - type: RandomCrop
              params: { size: [128, 128] }
            - type: RandomHorizontalFlip
              params: { p: 0.5 }
            - type: ToTensor
            - type: Normalize
              params: { mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225] }
  loader:
    batch_size: 16
    num_workers: 0
    pin_memory: false

model:
  type: SSLModel
  params:
    in_channels: 3
    projection_dim: 128
    hidden_dim: 256
    backbone:
      type: SimpleCNN
      params:
        channels: [16, 32, 64, 128]
        num_blocks: [2, 2, 2, 2]

loss:
  type: NTXentLoss
  params: { temperature: 0.5 }

optimizer:
  type: AdamW
  params: { lr: 0.001, weight_decay: 0.0001 }

scheduler:
  type: CosineAnnealingLR
  params: { T_max: 20 }

train:
  epochs: 20
  amp: false
  log_interval: 10
  save_best: { name: val_loss, mode: min }

# 自监督预训练没有任务指标,只监控对比损失
metrics: []
