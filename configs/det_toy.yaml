# FCOS 目标检测 + 合成数据 训练配置
# 生成数据: uv run python tools/make_toy_det_data.py --root data/det_toy --samples 120
# 训练:     uv run python tools/train.py --config configs/det_toy.yaml
task: detection
seed: 42
device: auto
output_dir: runs/det_toy

data:
  train:
    type: DetectionDataset
    params:
      image_dir: data/det_toy/train/images
      label_dir: data/det_toy/train/labels
      transform:
        type: Compose
        params:
          transforms:
            - type: DetRandomHorizontalFlip
              params: { p: 0.5 }
            - type: DetToTensor
            - type: Normalize
              params: { mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225] }
  val:
    type: DetectionDataset
    params:
      image_dir: data/det_toy/val/images
      label_dir: data/det_toy/val/labels
      transform:
        type: Compose
        params:
          transforms:
            - type: DetToTensor
            - type: Normalize
              params: { mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225] }
  loader:
    batch_size: 8
    num_workers: 0
    pin_memory: false

model:
  type: FCOS
  params:
    in_channels: 3
    num_classes: 3
    backbone:
      type: SimpleCNN
      params:
        channels: [16, 32, 64, 128]
        num_blocks: [2, 2, 2, 2]
    neck:
      type: FPN
      params: { out_channels: 128 }
    head:
      type: FCOSHead
      params: { num_convs: 3 }

loss:
  type: FCOSLoss
  params: { cls_weight: 1.0, reg_weight: 1.0, center_weight: 1.0 }

optimizer:
  type: AdamW
  params: { lr: 0.0002, weight_decay: 0.0001 }

scheduler:
  type: CosineAnnealingLR
  params: { T_max: 30 }

train:
  epochs: 30
  amp: false
  gradient_clip: 1.0
  log_interval: 10
  save_best: { name: mAP@0.5, mode: max }

metrics:
  - type: DetMetrics
    params: { iou_threshold: 0.5, score_threshold: 0.05, topk: 100 }
